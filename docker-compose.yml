# The published stack. Every application service runs a RELEASED image, pinned
# to one version — `docker compose up -d` pulls exactly what was tested and
# tagged, with no toolchain on the host and no build to wait for.
#
#   docker compose up -d                                     # run the release
#   ASH_VERSION=1.47.0 docker compose up -d                  # run another one
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
#                                                            # build from source
#
# The version default is rewritten by `npm run release:*` from the root
# package.json, and the release workflow refuses to ship if the two drift.
#
# No transport is here, on purpose: the core knows none. Each transport is its
# own repository, image and release, and running one is one service the
# operator adds — see the recipe in docs/operations/deployment.md. It registers
# itself with the core, and the core needs no dependency on it.
services:
  app:
    image: ghcr.io/assistants-swarm-hub/ash-core:${ASH_VERSION:-1.49.0}
    ports:
      - "${PORT:-3200}:3200"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3200
      # Built from the bundled db service; override DATABASE_URL to use an
      # external database.
      DATABASE_URL: ${DATABASE_URL:-postgres://${POSTGRES_USER:-bot}:${POSTGRES_PASSWORD:-bot}@db:5432/${POSTGRES_DB:-bot}}
      # The cross-app bus + transport queues. The token authenticates every
      # direction and must match the transport services' — set a real one in
      # .env. Transport base URLs are announced at registration, not
      # configured here.
      REDIS_URL: redis://redis:6379
      INTERNAL_API_TOKEN: ${INTERNAL_API_TOKEN:-change-me}
      TZ: ${TZ:-UTC}
    volumes:
      # Bind-mounted so trace/debug logs persist across restarts. The app writes
      # to ./data/traces relative to its working directory, which is
      # /app/core (the standalone server chdirs to its own directory).
      - "./data/traces:/app/core/data/traces"
      # Same for downloaded files, which are also reachable from the host: a file
      # too large to attach to the chat exists only here, so it must outlive the
      # container.
      - "./data/downloads:/app/core/data/downloads"
    healthcheck:
      # 127.0.0.1 (not localhost): the standalone server binds IPv4 0.0.0.0, and
      # localhost can resolve to IPv6 ::1, which would refuse the connection.
      test:
        ["CMD-SHELL", "wget -qO- http://127.0.0.1:3200/api/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s
    restart: unless-stopped

  redis:
    # The cross-app bus + inbound queue (v2 redesign; unused by the v1 app).
    # AOF persistence: queued inbound messages must survive a restart — the
    # no-message-loss guarantee lives here and in each app's store.
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - "./data/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  db:
    # pgvector image: plain Postgres today, with the vector extension available
    # for future embedding/memory features.
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bot}
      POSTGRES_DB: ${POSTGRES_DB:-bot}
      TZ: ${TZ:-UTC}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      # Bind-mounted host directory for persistence.
      - "./data/pg:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bot} -d ${POSTGRES_DB:-bot}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped
